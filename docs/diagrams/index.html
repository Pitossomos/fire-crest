d\n      +destroy() void\n    }\n    class mod_render_PhaseBanner[\"PhaseBanner.ts\"] {\n      \u003c\u003cmodule>>\n      +showPhaseBanner(scene: Phaser.Scene, label: string, faction: keyof typeof BANNER_COLOR) Promise~void~\n    }\n    class PixelCanvas {\n      +width: number\n      +height: number\n      -pixels: (string | null)[]\n      +set(x: number, y: number, color: string | null) void\n      +get(x: number, y: number) string | null\n      +fill(color: string) void\n      +rect(x: number, y: number, w: number, h: number, color: string) void\n      +stamp(template: readonly string[], palette: Record~string, string~, ox: any, oy: any) void\n      +paint(ctx: CanvasRenderingContext2D) void\n    }\n    class mod_render_pixel_canvas[\"pixel-canvas.ts\"] {\n      \u003c\u003cmodule>>\n      +hash2(x: number, y: number, seed: any) number\n    }\n    class mod_render_sfx[\"sfx.ts\"] {\n      \u003c\u003cmodule>>\n      +isMuted() boolean\n      +toggleMute() boolean\n      +playSfx(scene: Phaser.Scene, name: SfxName) void\n    }\n    class SidePanel {\n      -turnText: Phaser.GameObjects.Text\n      -terrainText: Phaser.GameObjects.Text\n      -unitTitle: Phaser.GameObjects.Text\n      -unitText: Phaser.GameObjects.Text\n      -hpBar: Phaser.GameObjects.Graphics\n      -helpText: Phaser.GameObjects.Text\n      +setTurn(turn: number, phase: keyof typeof PHASE_LABEL) void\n      +setTerrain(t: TerrainDef) void\n      +setUnit(u: Unit | undefined) void\n      +setHelp(message: string) void\n    }\n    class TextMenu {\n      -scene: Phaser.Scene\n      -items: Phaser.GameObjects.Text[]\n      -options: TextMenuOption[]\n      -index: number\n      -onPick: Function\n      -done: boolean\n      +selectedId: string\n      -onKey(ev: KeyboardEvent) void\n      -move(delta: number) void\n      -select(i: number, silent: any) void\n      -confirm() void\n    }\n    class TextMenuOption {\n      \u003c\u003cinterface>>\n      +id: string\n      +label: string\n      +enabled?: boolean\n    }\n    class mod_render_textures[\"textures.ts\"] {\n      \u003c\u003cmodule>>\n      +terrainTextureKey(terrainId: string, variant: number) string\n      +unitTextureKey(sprite: string, weaponType: string, faction: Faction, characterId: string) string\n      +resolveUnitTexture(scene: Phaser.Scene, sprite: string, weaponType: string, faction: Faction, characterId: string) string\n      +generateTextures(scene: Phaser.Scene, db: GameDatabase) void\n    }\n    class UnitSprite {\n      +unit: Unit\n      -container: Phaser.GameObjects.Container\n      -sprite: Phaser.GameObjects.Image\n      -hpBar: Phaser.GameObjects.Graphics\n      -scene: Phaser.Scene\n      +applyTexture() void\n      +fadeIn() Promise~void~\n      +refresh() void\n      +snap() void\n      +walk(path: Point[], msPerTile: any) Promise~void~\n      +lunge(toward: Point) Promise~void~\n      +flash() void\n      +dodge() void\n      +fadeOut() Promise~void~\n      +setSelected(selected: boolean) void\n      +destroy() void\n    }\n  }\n  ActionMenu \"1\" *-- \"*\" MenuOption : options\n  TextMenu \"1\" *-- \"*\" TextMenuOption : options"},{"id":"classes-save","title":"Camada `save`","description":"Atributos e métodos dos tipos em `src/save/`. Relações apenas internas à camada.","source":"---\ntitle: Classes — save\n---\nclassDiagram\n  direction LR\n  namespace save {\n    class KeyValueStore {\n      \u003c\u003cinterface>>\n      +getItem(key: string) string | null\n      +setItem(key: string, value: string) void\n      +removeItem(key: string) void\n    }\n    class mod_save_save[\"save.ts\"] {\n      \u003c\u003cmodule>>\n      +defaultStore() KeyValueStore | undefined\n      +loadSave(store: KeyValueStore | undefined) SaveData | undefined\n      +writeSave(data: SaveData, store: KeyValueStore | undefined) boolean\n      +clearSave(store: KeyValueStore | undefined) void\n    }\n  }"},{"id":"classes-scenes","title":"Camada `scenes`","description":"Atributos e métodos dos tipos em `src/scenes/`. Relações apenas internas à camada.","source":"---\ntitle: Classes — scenes\n---\nclassDiagram\n  direction LR\n  namespace scenes {\n    class BattleScene {\n      -state: BattleState\n      -mapView: MapView\n      -panel: SidePanel\n      -menu: ActionMenu\n      -sprites: Map~string, UnitSprite~\n      -mode: Mode\n      -cursor: Point\n      -selection: Selection\n      -menuCancel: Function\n      -forecastPanel: ForecastPanel\n      -eventEngine: EventEngine\n      -save: SaveData\n      -ended: boolean\n      +outcome: victory | defeat\n      -targeting: Targeting\n      +battle: BattleState\n      +create(data: object) void\n      -intro() Promise~void~\n      -runEvents(effects: EventEffects[]) Promise~void~\n      -bindInput() void\n      -onKey(code: string) void\n      -confirm() void\n      -cancel() void\n      -select(unit: Unit) void\n      -deselect() void\n      -inspect(unit: Unit) void\n      -clearInspect() void\n      -moveSelected(to: Point) Promise~void~\n      -openUnitMenu(sel: Selection) void\n      -openItemMenu(sel: Selection) void\n      -executeItem(unit: Unit, index: number) Promise~void~\n      -executeTalk(unit: Unit, event: Parameters~EventEngine[talk]~[1]) Promise~void~\n      -executeHeal(healer: Unit, target: Unit) Promise~void~\n      -startTargeting(kind: Targeting[kind], sel: Selection, targets: Unit[]) void\n      -selectTarget(i: number) void\n      -cancelTargeting() void\n      -executeAttack(attacker: Unit, defender: Unit) Promise~void~\n      -playCombat(attacker: Unit, defender: Unit, outcome: AttackOutcome) Promise~void~\n      -undoMove(sel: Selection) void\n      -finishAction(unit: Unit) Promise~void~\n      -openMapMenu() void\n      -runEndPhase() Promise~void~\n      -runAiPhase() Promise~boolean~\n      -showTerrainHeals() Promise~void~\n      -checkOutcome() boolean\n      -endBattle(result: victory | defeat) Promise~void~\n      -wait(ms: number) Promise~void~\n      -waitForConfirm() Promise~void~\n      -announcePhase() Promise~void~\n      -setMode(mode: Mode) void\n      -setCursor(p: Point) void\n      -refreshPanel() void\n      -refreshSprites() void\n    }\n    class Targeting {\n      \u003c\u003cinterface>>\n      +kind: attack | heal\n      +sel: Selection\n      +targets: Unit[]\n      +index: number\n    }\n    class Selection {\n      \u003c\u003cinterface>>\n      +unit: Unit\n      +origin: Point\n      +range: RangeInfo\n      +moveKeys: Set~string~\n    }\n    class BootScene {\n      +create() void\n    }\n    class DialogueScene {\n      -lines: DialogueLine[]\n      -index: number\n      -onDone: Function\n      -body: Phaser.GameObjects.Text\n      -nameText: Phaser.GameObjects.Text\n      -namePlate: Phaser.GameObjects.Rectangle\n      -portrait: Phaser.GameObjects.Image\n      -portraitFrame: Phaser.GameObjects.Rectangle\n      -hint: Phaser.GameObjects.Text\n      -typing: Phaser.Time.TimerEvent\n      -fullText: string\n      -finished: boolean\n      +create(data: DialogueData) void\n      -showLine() void\n      -advance() void\n      -finish() void\n    }\n    class DialogueData {\n      \u003c\u003cinterface>>\n      +lines: DialogueLine[]\n      +onDone: Function\n    }\n    class mod_scenes_DialogueScene[\"DialogueScene.ts\"] {\n      \u003c\u003cmodule>>\n      +runDialogue(scene: Phaser.Scene, lines: DialogueLine[]) Promise~void~\n    }\n    class ResultScene {\n      +menu: TextMenu\n      +create(data: ResultData) void\n      -drawRoster(save: SaveData) void\n    }\n    class ResultData {\n      \u003c\u003cinterface>>\n      +result: victory | defeat\n      +stageName: string\n      +save: SaveData\n    }\n    class TitleScene {\n      +menu: TextMenu\n      +create() void\n      -newGame(mode: GameMode) SaveData\n      -startBattle(save: SaveData) void\n      -spawnEmber(anywhere: boolean) void\n    }\n    class mod_scenes_TitleScene[\"TitleScene.ts\"] {\n      \u003c\u003cmodule>>\n      +urlParams() object\n    }\n  }\n  class Phaser_Scene[\"Phaser.Scene\"] {\n    \u003c\u003cexternal>>\n  }\n  BattleScene --> Selection : selection\n  BattleScene --> Targeting : targeting\n  Phaser_Scene \u003c|-- BattleScene\n  Phaser_Scene \u003c|-- BootScene\n  Phaser_Scene \u003c|-- DialogueScene\n  Phaser_Scene \u003c|-- ResultScene\n  Phaser_Scene \u003c|-- TitleScene\n  Targeting --> Selection : sel"}]},{"title":"Entidade-Relacionamento","diagrams":[{"id":"er","title":"Entidades e relacionamentos","description":"Interfaces marcadas com `@entity`. `Ref\u003cX>` é chave estrangeira (FK) para X; listas e objetos embutidos são relações 1:N / 1:1.","source":"---\ntitle: Modelo de dados (entidades @entity)\n---\nerDiagram\n  ChapterDef {\n    string id PK\n    string name\n    list stageIds FK \"-> StageDef\"\n  }\n  CharacterDef {\n    string id PK\n    string name\n    string title_ \"campo title\"\n    string classId FK \"-> ClassDef\"\n    number level\n    Stats stats\n    Stats growths\n    string weaponId FK \"-> WeaponDef\"\n    list items FK \"-> ItemDef; opcional\"\n    string bio\n    boolean villain \"opcional\"\n    string hair \"opcional\"\n  }\n  ClassDef_[\"ClassDef\"] {\n    string id PK\n    string name\n    number move\n    list weaponTypes \"WeaponType[]\"\n    Stats baseStats\n    Stats growths\n    string sprite\n    boolean isLord \"opcional\"\n  }\n  DialogueLine {\n    string speakerId FK \"-> CharacterDef\"\n    PortraitSide side\n    string text\n  }\n  EventTrigger {\n    string id PK\n    EventKind on\n    number turn \"opcional\"\n    string unitId FK \"-> CharacterDef; opcional\"\n    string otherUnitId FK \"-> CharacterDef; opcional\"\n    number x \"opcional\"\n    number y \"opcional\"\n    list dialogue \"DialogueLine[]\"\n    list spawns \"UnitPlacement[]\"\n    string recruitId FK \"-> CharacterDef; opcional\"\n  }\n  InventorySlot {\n    string itemId FK \"-> ItemDef\"\n    number uses\n  }\n  ItemDef {\n    string id PK\n    string name\n    number heal\n    number uses\n  }\n  MapDef {\n    list rows \"string[]\"\n    map legend FK \"-> TerrainDef\"\n  }\n  ObjectiveDef {\n    ObjectiveKind kind\n    string description\n    number x \"opcional\"\n    number y \"opcional\"\n    number turns \"opcional\"\n    string targetId FK \"-> CharacterDef; opcional\"\n  }\n  RosterEntry {\n    string characterId FK \"-> CharacterDef\"\n    number level\n    number exp\n    Stats stats\n    string weaponId FK \"-> WeaponDef\"\n    list items \"InventorySlot[]\"\n    boolean alive\n  }\n  SaveData {\n    number version\n    GameMode mode\n    string chapterId FK \"-> ChapterDef\"\n    number nextStageIndex\n    list roster \"RosterEntry[]\"\n  }\n  StageDef {\n    string id PK\n    string chapterId FK \"-> ChapterDef\"\n    number order\n    string name\n    ObjectiveDef objective\n    MapDef map\n    list units \"UnitPlacement[]\"\n    list preDialogue \"DialogueLine[]\"\n    list postDialogue \"DialogueLine[]\"\n    list events \"EventTrigger[]\"\n    list recruitOnClear FK \"-> CharacterDef; opcional\"\n  }\n  TerrainDef {\n    string id PK\n    string name\n    number moveCost \"number | null\"\n    number def\n    number avoid\n    number heal\n  }\n  UnitPlacement {\n    string characterId FK \"-> CharacterDef; opcional\"\n    string classId FK \"-> ClassDef; opcional\"\n    string weaponId FK \"-> WeaponDef; opcional\"\n    string name \"opcional\"\n    Faction faction\n    number x\n    number y\n    number level \"opcional\"\n    AiBehavior ai \"opcional\"\n    boolean boss \"opcional\"\n    boolean joins \"opcional\"\n  }\n  WeaponDef {\n    string id PK\n    string name\n    WeaponType type\n    number might\n    number hit\n    number crit\n    number minRange\n    number maxRange\n    boolean magic\n    number heal \"opcional\"\n    list effective FK \"-> ClassDef; opcional\"\n  }\n  ChapterDef }o--o{ StageDef : \"stageIds\"\n  CharacterDef }o--o{ ItemDef : \"items\"\n  CharacterDef }o--|| ClassDef_ : \"classId\"\n  CharacterDef }o--|| WeaponDef : \"weaponId\"\n  DialogueLine }o--|| CharacterDef : \"speakerId\"\n  EventTrigger ||--o{ DialogueLine : \"dialogue\"\n  EventTrigger ||--o{ UnitPlacement : \"spawns\"\n  EventTrigger }o--o| CharacterDef : \"otherUnitId\"\n  EventTrigger }o--o| CharacterDef : \"recruitId\"\n  EventTrigger }o--o| CharacterDef : \"unitId\"\n  InventorySlot }o--|| ItemDef : \"itemId\"\n  MapDef }o--o{ TerrainDef : \"legend\"\n  ObjectiveDef }o--o| CharacterDef : \"targetId\"\n  RosterEntry ||--o{ InventorySlot : \"items\"\n  RosterEntry }o--|| CharacterDef : \"characterId\"\n  RosterEntry }o--|| WeaponDef : \"weaponId\"\n  SaveData ||--o{ RosterEntry : \"roster\"\n  SaveData }o--|| ChapterDef : \"chapterId\"\n  StageDef ||--o{ DialogueLine : \"postDialogue\"\n  StageDef ||--o{ DialogueLine : \"preDialogue\"\n  StageDef ||--o{ EventTrigger : \"events\"\n  StageDef ||--o{ UnitPlacement : \"units\"\n  StageDef ||--|| MapDef : \"map\"\n  StageDef ||--|| ObjectiveDef : \"objective\"\n  StageDef }o--o{ CharacterDef : \"recruitOnClear\"\n  StageDef }o--|| ChapterDef : \"chapterId\"\n  UnitPlacement }o--o| CharacterDef : \"characterId\"\n  UnitPlacement }o--o| ClassDef_ : \"classId\"\n  UnitPlacement }o--o| WeaponDef : \"weaponId\"\n  WeaponDef }o--o{ ClassDef_ : \"effective\""}]}];
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'loose', maxTextSize: 500000 });
  const tabs = document.getElementById('tabs');
  const content = document.getElementById('content');
  async function show(i) {
    [...tabs.children].forEach((b, j) => b.setAttribute('aria-pressed', String(i === j)));
    content.innerHTML = '';
    for (const d of groups[i].diagrams) {
      const s = document.createElement('section');
      s.innerHTML = '<div class="tools"><button>Ajustar à largura</button></div><h2></h2><p></p><div class="mermaid"></div>';
      const toggle = s.querySelector('.tools button');
      toggle.onclick = () => {
        const fit = s.classList.toggle('fit');
        toggle.textContent = fit ? 'Tamanho real' : 'Ajustar à largura';
      };
      s.querySelector('h2').textContent = d.title;
      s.querySelector('p').textContent = d.description;
      content.append(s);
      const { svg } = await mermaid.render('d_' + d.id, d.source);
      const holder = s.querySelector('.mermaid');
      holder.innerHTML = svg;
      // Tamanho real (largura do viewBox) com rolagem; o botão alterna para caber na largura.
      const el = holder.querySelector('svg');
      const vb = el.viewBox.baseVal;
      if (vb && vb.width) { el.style.width = vb.width + 'px'; el.style.maxWidth = 'none'; el.removeAttribute('width'); }
    }
  }
  groups.forEach((g, i) => {
    const b = document.createElement('button');
    b.textContent = g.title;
    b.onclick = () => show(i);
    tabs.append(b);
  });
  show(0);
</script>
